<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magiske Timer 2026 | Bergen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--dark:#0f172a;--light:#f8fafc;--border:rgba(212,175,55,0.3);--dealer-bg:#e2e8f0}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;margin:0;background-color:var(--dark);color:var(--light);line-height:1.6}
nav{position:sticky;top:0;background:rgba(15,23,42,0.95);border-bottom:1px solid var(--border);z-index:1000;padding:15px;text-align:center;backdrop-filter:blur(10px)}
nav a{color:var(--light);text-decoration:none;margin:0 15px;font-size:.85rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
header{background:linear-gradient(rgba(15,23,42,.85),rgba(15,23,42,.85)),url('https://images.unsplash.com/photo-1504194906613-324209869635?q=80&w=2070&auto=format&fit=crop');background-size:cover;[...]
.hero-location{font-weight:900;font-size:clamp(2rem,8vw,5rem);color:var(--gold);text-transform:uppercase;line-height:1;margin-bottom:10px;letter-spacing:0px}
h1{font-weight:900;font-size:clamp(3.5rem,15vw,10rem);margin:0;color:var(--light);text-transform:uppercase;letter-spacing:-5px;line-height:.85}
#countdown-container{background:rgba(255,255,255,.05);padding:30px;border-radius:20px;border:2px solid var(--gold);margin:50px 0;backdrop-filter:blur(10px)}
.timer{display:flex;gap:30px;justify-content:center}
.time-box span:first-child{font-size:clamp(2.5rem,6vw,4rem);font-weight:900;color:var(--light);display:block;line-height:1}
.time-box span:last-child{font-size:.8rem;color:var(--gold);text-transform:uppercase;font-weight:800;letter-spacing:1px}
.content-wrapper{max-width:1300px;margin:0 auto;padding:80px 20px}
section{margin-bottom:150px;scroll-margin-top:100px}
h2{font-weight:900;font-size:clamp(2.5rem,10vw,5.5rem);color:var(--gold);text-transform:uppercase;margin-bottom:40px;letter-spacing:0px;line-height:1;text-align:center}
.info-row{display:flex;align-items:center;gap:60px}
.info-row.reverse{flex-direction:row-reverse}
.image-box{flex:2;text-align:center}
.image-box img{width:100%;border-radius:15px;border:1px solid var(--border);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.img-caption{margin-top:20px;font-weight:700;color:var(--gold);font-size:1.1rem;text-align:center}
.text-box{flex:1}
.text-box p{font-size:1.4rem;opacity:.95}
.info-row.reverse .image-box{flex:.7;max-width:300px}
.info-row.reverse .text-box{flex:2.3}
.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:30px;max-width:1200px;margin:50px auto}
.video-container{width:100%;border-radius:15px;border:2px solid var(--gold);overflow:hidden;background:#000;aspect-ratio:16/9;position:relative}
.video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.image-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:50px}
.grid-item{text-align:center;display:flex;flex-direction:column}
.grid-item img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--border);transition:.4s}
.grid-item img:hover{transform:translateY(-10px);border-color:var(--gold)}
.artist-desc{margin-top:15px;font-weight:700;color:var(--gold);font-size:1rem;line-height:1.4;padding:0 10px}
.vote-card{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:20px;padding:40px 30px;max-width:950px;margin:0 auto;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.vote-card h3{margin:0 0 10px;color:var(--gold);font-size:2rem;text-transform:uppercase;font-weight:900;letter-spacing:-1px;text-align:center}
.vote-card p{text-align:center;max-width:760px;margin:0 auto 26px;font-size:1.05rem;opacity:.92}
.vote-form-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:18px}
.vote-form-meta input,.vote-form-meta textarea{width:100%;padding:14px 15px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--light);border-radius:10px;box-sizing:border-[...]
.vote-form-meta textarea{grid-column:1/-1;min-height:110px;resize:vertical}
.vote-form-meta input::placeholder,.vote-form-meta textarea::placeholder{color:rgba(248,250,252,.72)}
.vote-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:28px}
.vote-option{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.18);border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:12px}
.vote-option input[type="checkbox"]{transform:scale(1.2);margin-top:3px}
.vote-option label{font-weight:700;cursor:pointer;line-height:1.45}
.vote-submit{display:block;margin:0 auto;background:var(--gold);color:var(--dark);border:none;padding:15px 24px;border-radius:10px;font-weight:900;text-transform:uppercase;cursor:pointer;font-size[...]
.vote-note{margin-top:18px;text-align:center;font-size:.92rem;color:rgba(248,250,252,.74)}
.dealer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,200px));gap:20px;justify-content:center;margin-top:40px}
.dealer-item{background:var(--dealer-bg);padding:20px;border-radius:10px;border:1px solid rgba(0,0,0,.1);text-align:center;transition:.3s;display:flex;align-items:center;justify-content:center;min[...]
.dealer-img{max-width:100%;max-height:60px;object-fit:contain!important}
.program-grid{display:flex;gap:20px;margin-top:40px}
.program-day{flex:1;background:rgba(255,255,255,.03);padding:30px;border-radius:15px;border:1px solid var(--border)}
