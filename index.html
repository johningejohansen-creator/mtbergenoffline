<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magiske Timer 2026 | Bergen</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #d4af37;
  --dark: #0f172a;
  --light: #f8fafc;
  --border: rgba(212,175,55,0.3);
}

body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: var(--dark);
  color: var(--light);
}

/* ===== TICKER ===== */
.ticker {
  width: 100%;
  overflow: hidden;
  background: var(--gold);
  color: var(--dark);
  font-weight: 900;
  font-size: 0.8rem;
  white-space: nowrap;
}

.ticker-content {
  display: inline-block;
  padding-left: 100%;
  animation: ticker 25s linear infinite;
}

@keyframes ticker {
  0% { transform: translateX(0%); }
  100% { transform: translateX(-100%); }
}

/* NAV */
nav {
  position: sticky;
  top: 0;
  background: rgba(15,23,42,0.95);
  padding: 15px;
  text-align: center;
}

nav a {
  color: var(--light);
  text-decoration: none;
  margin: 0 15px;
  font-weight: 900;
}

/* HEADER */
header {
  min-height: 80vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  border-bottom:5px solid var(--gold);
}

.hero-location {
  font-size:3rem;
  color:var(--gold);
  font-weight:900;
}

h1 {
  font-size:5rem;
  margin:0;
}

/* BUTTON */
.btn-reg {
  background: var(--gold);
  color: var(--dark);
  border:none;
  padding:15px;
  font-weight:900;
  cursor:pointer;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
}

.modal-content {
  background:var(--dark);
  padding:30px;
  margin:10% auto;
  max-width:400px;
  border:2px solid var(--gold);
}

.modal-content input {
  width:100%;
  padding:10px;
  margin:10px 0;
}

.close {
  float:right;
  font-size:30px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- TICKER -->
<div class="ticker">
  <div class="ticker-content">
    ✨ <span id="lastUpdated"></span> — Påmelding er åpen • Nye artister publiseres fortløpende • Velkommen til Bergen!
  </div>
</div>

<nav>
  <a href="#">Hjem</a>
  <a href="#Paamelding">Påmelding</a>
</nav>

<header>
  <div class="hero-location">BERGEN 18–20 SEPT 2026</div>
  <h1>Magiske Timer</h1>
</header>

<main style="padding:40px; text-align:center;">

<section id="Paamelding">
<h2>Påmelding</h2>

<button class="btn-reg" onclick="openModal('Senior')">Simsalabim</button>

</section>

</main>

<!-- MODAL -->
<div id="regModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3 id="ticketType">Påmelding</h3>

    <form id="signupForm">
      <input type="hidden" name="Billettype" id="hiddenTicket">

      <input type="text" name="Navn" required placeholder="Fullt navn">
      <input type="email" name="email" required placeholder="E-post">
      <input type="tel" name="Telefon" required placeholder="Telefon">

      <button type="submit" class="btn-reg">Send</button>
    </form>

    <p id="status"></p>
  </div>
</div>

<script>
function openModal(type){
  document.getElementById("regModal").style.display="block";
  document.getElementById("ticketType").innerText=type;
  document.getElementById("hiddenTicket").value=type;
}

function closeModal(){
  document.getElementById("regModal").style.display="none";
}

window.onclick=function(e){
  if(e.target==document.getElementById("regModal")) closeModal();
}

/* FORM SUBMIT + REDIRECT */
const form = document.getElementById("signupForm");
const status = document.getElementById("status");

form.addEventListener("submit", async function(e){
  e.preventDefault();

  const data = new FormData(form);

  const response = await fetch("https://formspree.io/f/mnjbkyld", {
    method: "POST",
    body: data,
    headers: { Accept: "application/json" }
  });

  if(response.ok){
    window.location.href = "/takk/";
  } else {
    status.innerText = "Noe gikk galt.";
  }
});

/* AUTO DATO */
const now = new Date();
document.getElementById("lastUpdated").innerText =
  "Sist oppdatert: " +
  now.toLocaleDateString("no-NO", { day:"numeric", month:"long", year:"numeric" });
</script>

</body>
</html>
