<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magiske Timer 2026 | Bergen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--dark:#0f172a;--light:#f8fafc;--border:rgba(212,175,55,0.3);--dealer-bg:#e2e8f0}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;margin:0;background-color:var(--dark);color:var(--light);line-height:1.6}
nav{position:sticky;top:0;background:rgba(15,23,42,0.95);border-bottom:1px solid var(--border);z-index:1000;padding:15px;text-align:center;backdrop-filter:blur(10px)}
nav a{color:var(--light);text-decoration:none;margin:0 15px;font-size:.85rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
header{background:linear-gradient(rgba(15,23,42,.85),rgba(15,23,42,.85)),url('https://images.unsplash.com/photo-1504194906613-324209869635?q=80&w=2070&auto=format&fit=crop');background-size:cover;background-position:center;min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 20px;text-align:center;border-bottom:5px solid var(--gold)}
.hero-location{font-weight:900;font-size:clamp(2rem,8vw,5rem);color:var(--gold);text-transform:uppercase;line-height:1;margin-bottom:10px;letter-spacing:0px}
h1{font-weight:900;font-size:clamp(3.5rem,15vw,10rem);margin:0;color:var(--light);text-transform:uppercase;letter-spacing:-5px;line-height:.85}
#countdown-container{background:rgba(255,255,255,.05);padding:30px;border-radius:20px;border:2px solid var(--gold);margin:50px 0;backdrop-filter:blur(10px)}
.timer{display:flex;gap:30px;justify-content:center}
.time-box span:first-child{font-size:clamp(2.5rem,6vw,4rem);font-weight:900;color:var(--light);display:block;line-height:1}
.time-box span:last-child{font-size:.8rem;color:var(--gold);text-transform:uppercase;font-weight:800;letter-spacing:1px}
.content-wrapper{max-width:1300px;margin:0 auto;padding:80px 20px}
section{margin-bottom:150px;scroll-margin-top:100px}
h2{font-weight:900;font-size:clamp(2.5rem,10vw,5.5rem);color:var(--gold);text-transform:uppercase;margin-bottom:40px;letter-spacing:0px;line-height:1;text-align:center}
.info-row{display:flex;align-items:center;gap:60px}
.info-row.reverse{flex-direction:row-reverse}
.image-box{flex:2;text-align:center}
.image-box img{width:100%;border-radius:15px;border:1px solid var(--border);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.img-caption{margin-top:20px;font-weight:700;color:var(--gold);font-size:1.1rem;text-align:center}
.text-box{flex:1}
.text-box p{font-size:1.4rem;opacity:.95}
.info-row.reverse .image-box{flex:.7;max-width:300px}
.info-row.reverse .text-box{flex:2.3}
.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:30px;max-width:1200px;margin:50px auto}
.video-container{width:100%;border-radius:15px;border:2px solid var(--gold);overflow:hidden;background:#000;aspect-ratio:16/9;position:relative}
.video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.image-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:50px}
.grid-item{text-align:center;display:flex;flex-direction:column}
.grid-item img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--border);transition:.4s}
.grid-item img:hover{transform:translateY(-10px);border-color:var(--gold)}
.artist-desc{margin-top:15px;font-weight:700;color:var(--gold);font-size:1rem;line-height:1.4;padding:0 10px}
.vote-card{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:20px;padding:40px 30px;max-width:950px;margin:0 auto;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.vote-card h3{margin:0 0 10px;color:var(--gold);font-size:2rem;text-transform:uppercase;font-weight:900;letter-spacing:-1px;text-align:center}
.vote-card p{text-align:center;max-width:760px;margin:0 auto 26px;font-size:1.05rem;opacity:.92}
.vote-form-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:18px}
.vote-form-meta input,.vote-form-meta textarea{width:100%;padding:14px 15px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--light);border-radius:10px;box-sizing:border-box;font-family:inherit;font-size:1rem}
.vote-form-meta textarea{grid-column:1/-1;min-height:110px;resize:vertical}
.vote-form-meta input::placeholder,.vote-form-meta textarea::placeholder{color:rgba(248,250,252,.72)}
.vote-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:28px}
.vote-option{background:rgba(255,255,255,.04);border:1px solid rgba(212,175,55,.18);border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:12px}
.vote-option input[type="checkbox"]{transform:scale(1.2);margin-top:3px}
.vote-option label{font-weight:700;cursor:pointer;line-height:1.45}
.vote-submit{display:block;margin:0 auto;background:var(--gold);color:var(--dark);border:none;padding:15px 24px;border-radius:10px;font-weight:900;text-transform:uppercase;cursor:pointer;font-size:1rem}
.vote-note{margin-top:18px;text-align:center;font-size:.92rem;color:rgba(248,250,252,.74)}
.hotel-modal-logo{
display:block;
max-width:220px;
width:100%;
height:auto;
margin:0 auto 20px auto;
object-fit:contain;
}
    .dealer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,200px));gap:20px;justify-content:center;margin-top:40px}
.dealer-item{background:var(--dealer-bg);padding:20px;border-radius:10px;border:1px solid rgba(0,0,0,.1);text-align:center;transition:.3s;display:flex;align-items:center;justify-content:center;min-height:100px}
.dealer-img{max-width:100%;max-height:60px;object-fit:contain!important}
.dealer-item.fill{padding:0;overflow:hidden}
.dealer-item.fill .dealer-img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover!important}
.dealer-item.fill a{display:block;width:100%;height:100%;line-height:0}
.practical-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;margin-top:40px}
.practical-item{background:rgba(255,255,255,.03);padding:30px;border-radius:15px;border:1px solid var(--border);min-height:520px;display:flex;flex-direction:column}
.practical-item h3{color:var(--gold);text-transform:uppercase;margin-top:0;font-size:1.5rem}
.practical-item p{flex:1}
.hotel-logo{display:block;max-width:260px;width:100%;height:auto;margin:22px auto 0;border-radius:14px;background:#fff;padding:14px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.weather-container{border-radius:10px;overflow:hidden;margin-top:15px;min-height:430px;flex:1}
.weather-container iframe{min-height:430px!important}
.pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:25px;margin-top:50px}
.price-card{background:rgba(255,255,255,.05);border:1px solid var(--border);padding:40px 30px;border-radius:20px;text-align:center;display:flex;flex-direction:column;transition:.3s}
.price-card h4{font-size:1.3rem;margin:0;color:var(--gold);text-transform:uppercase;font-weight:900}
.price-card .amount{font-size:3rem;font-weight:900;margin:20px 0;letter-spacing:-1px}
.btn-reg{background:var(--gold);color:var(--dark);border:none;padding:15px;font-weight:900;text-transform:uppercase;border-radius:8px;cursor:pointer;width:100%;transition:.3s;font-size:1.1rem;margin-top:auto}
.btn-reg:hover{transform:translateY(-2px)}
.modal{display:none;position:fixed;z-index:2000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.95);backdrop-filter:blur(10px)}
.modal-content{background:var(--dark);margin:5% auto;padding:50px;border:3px solid var(--gold);width:90%;max-width:500px;border-radius:20px;position:relative}
.modal-content input{width:100%;padding:15px;margin:10px 0 20px 0;background:rgba(255,255,255,.05);border:1px solid var(--border);color:#fff;border-radius:8px;box-sizing:border-box}
.modal-content input::placeholder{color:rgba(248,250,252,.75)}
.modal-note{font-size:.9rem;opacity:.85;margin-top:10px}
.status-message{margin-top:15px;font-weight:700;min-height:24px}
.close{position:absolute;right:25px;top:15px;color:#fff;font-size:35px;cursor:pointer}
footer{padding:80px 20px;background:#020617;text-align:center;border-top:1px solid #1e293b}
.footer-logo{max-width:180px;margin-bottom:25px;filter:brightness(1.5)}
@media (max-width:1100px){.info-row,.info-row.reverse{flex-direction:column}.video-grid{grid-template-columns:1fr}.image-grid{grid-template-columns:1fr 1fr}}
@media (max-width:700px){nav a{margin:0 8px;font-size:.72rem}.timer{gap:18px}.content-wrapper{padding:60px 16px}section{margin-bottom:100px}.image-grid{grid-template-columns:1fr}.modal-content{padding:30px 22px;margin:10% auto}.vote-form-meta{grid-template-columns:1fr}}
 
@media (max-width:700px){
.modal-content{
width:92%!important;
max-width:92%!important;
padding:24px 18px!important;
margin:8% auto!important;
max-height:85vh;
overflow-y:auto;
box-sizing:border-box;
}
#hotelModal .modal-content{
border-width:2px;
}
#hotelBookingForm input{
font-size:16px;
padding:14px;
}
#hotelBookingForm label{
font-size:0.95rem;
line-height:1.4;
}
#hotelModalTitle{
font-size:1.5rem;
text-align:center;
}
}
 
 
/* Dynamisk hotellbooking-modal for mobil, nettbrett og PC */
.modal{
overflow-y:auto;
padding:24px 12px;
box-sizing:border-box;
}
 
.modal-content{
margin:clamp(16px,5vh,60px) auto;
padding:clamp(22px,4vw,50px);
width:min(92vw,540px);
max-height:calc(100vh - 48px);
overflow-y:auto;
box-sizing:border-box;
}
 
#hotelModal .modal-content{
width:min(94vw,560px);
}
 
#hotelBookingForm input,
#signupForm input{
width:100%;
padding:clamp(13px,2.5vw,16px);
margin:10px 0 18px 0;
box-sizing:border-box;
font-size:16px;
}
 
#hotelBookingForm .vote-option{
align-items:center;
gap:10px;
}
 
#hotelBookingForm input[type="radio"]{
width:auto;
margin:0;
flex:0 0 auto;
}
 
#hotelBookingForm label{
line-height:1.35;
}
 
#hotelModalTitle{
font-size:clamp(1.45rem,5vw,2rem);
text-align:center;
margin-top:0;
color:var(--gold);
}
 
@media (min-width:900px){
#hotelModal .modal-content{
width:min(48vw,620px);
}
}
 
@media (max-width:700px){
.modal{
padding:10px;
}
 
.modal-content,
#hotelModal .modal-content{
width:96vw!important;
max-width:96vw!important;
margin:12px auto!important;
padding:22px 16px!important;
max-height:calc(100vh - 24px);
border-width:2px;
border-radius:16px;
}
 
.close{
right:16px;
top:10px;
font-size:32px;
}
 
#hotelModal .vote-option{
padding:14px 12px;
}
 
#hotelModal .btn-reg{
font-size:1rem;
padding:14px;
}
 
#hotelModal p{
font-size:.95rem;
line-height:1.45;
}
}
 

/* ---- Captain Frodo-seksjon ---- */
.frodo-section{max-width:1300px;margin:0 auto 150px;padding:0 20px}
.frodo-kicker{display:block;text-align:center;color:var(--gold);font-weight:900;text-transform:uppercase;letter-spacing:4px;font-size:.85rem;margin-bottom:12px}
.frodo-title{font-weight:900;font-size:clamp(2.8rem,10vw,6rem);color:var(--light);text-transform:uppercase;line-height:.9;letter-spacing:-3px;text-align:center;margin:0 0 18px}
.frodo-title span{color:var(--gold);display:block}
.frodo-lead{max-width:820px;margin:0 auto 55px;text-align:center;font-size:clamp(1.15rem,2.6vw,1.5rem);line-height:1.6;opacity:.95}
.frodo-lead strong{color:var(--gold)}
.frodo-hero{position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 30px 60px rgba(0,0,0,.6);margin-bottom:60px}
.frodo-hero img{display:block;width:100%;height:clamp(320px,52vh,620px);object-fit:cover}
.frodo-hero-caption{position:absolute;left:0;right:0;bottom:0;padding:60px 30px 26px;background:linear-gradient(transparent,rgba(15,23,42,.95));font-weight:700;color:var(--gold);font-size:clamp(.95rem,2vw,1.15rem)}
.frodo-duo{display:grid;grid-template-columns:1fr 1fr;gap:26px;max-width:760px;margin:0 auto 60px}
.frodo-duo img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;border:1px solid var(--border);box-shadow:0 18px 36px rgba(0,0,0,.5);display:block}
.frodo-body{max-width:820px;margin:0 auto;font-size:1.15rem;line-height:1.7;opacity:.95;text-align:center}
@media (max-width:640px){
.frodo-duo{gap:14px}
}

/* ---- Kalenderark (klikkbare datoer) ---- */
.datecards{position:relative;z-index:5;margin:-78px auto 60px;padding:0 20px;max-width:1000px;scroll-margin-top:100px}
.datecard-row{display:flex;justify-content:center;align-items:flex-start;gap:clamp(14px,3vw,40px);flex-wrap:wrap}
.datecard{flex:0 1 250px;max-width:270px;background:#f8fafc;border-radius:5px 5px 12px 12px;overflow:hidden;text-decoration:none;color:var(--dark);box-shadow:0 22px 45px rgba(0,0,0,.55);transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s}
.datecard:nth-child(1){transform:rotate(-2.5deg)}
.datecard:nth-child(2){transform:rotate(.8deg)}
.datecard:nth-child(3){transform:rotate(2.5deg)}
.datecard:hover,.datecard:focus-visible{transform:rotate(0) translateY(-14px);box-shadow:0 34px 60px rgba(0,0,0,.65),0 0 0 3px var(--gold)}
.datecard:focus-visible{outline:none}
.dc-bind{height:32px;background:var(--gold);display:flex;justify-content:center;align-items:center;gap:70px}
.dc-hole{width:11px;height:11px;border-radius:50%;background:var(--dark);box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.dc-perf{height:9px;background-image:radial-gradient(circle at 5px 4px,rgba(15,23,42,.3) 1.6px,transparent 2.2px);background-size:11px 100%;background-color:#f8fafc}
.dc-body{padding:14px 18px 20px;text-align:center}
.dc-month{font-size:.78rem;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#8a6d1f}
.dc-num{font-size:clamp(4rem,12vw,5.4rem);font-weight:900;line-height:.85;letter-spacing:-4px;margin:6px 0 2px}
.dc-weekday{font-size:1rem;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:var(--dark);opacity:.75}
.dc-teaser{margin-top:12px;padding-top:12px;border-top:1px solid rgba(15,23,42,.15);font-size:.88rem;line-height:1.4;font-weight:700;color:#475569;min-height:2.4em}
.dc-stub{background:var(--dark);color:var(--gold);font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:2px;padding:11px 10px;text-align:center}
.datecards-hint{text-align:center;margin-top:26px;font-size:.85rem;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:var(--gold);opacity:.75}
@media (max-width:760px){
.datecards{margin:-40px auto 70px;padding:0 14px}
.datecard-row{gap:10px;flex-wrap:nowrap}
.datecard{flex:1 1 0;min-width:0;max-width:none}
.datecard:nth-child(n){transform:none}
.dc-bind{gap:30px;height:24px}
.dc-hole{width:8px;height:8px}
.dc-body{padding:10px 8px 14px}
.dc-month{font-size:.6rem;letter-spacing:1.5px}
.dc-num{letter-spacing:-2px}
.dc-weekday{font-size:.75rem;letter-spacing:1px}
.dc-teaser{display:none}
.dc-stub{font-size:.58rem;letter-spacing:1px;padding:9px 4px}
}
@media (prefers-reduced-motion:reduce){
.datecard,.datecard:nth-child(n){transform:none;transition:none}
.datecard:hover,.datecard:focus-visible{transform:none}
}


/* ---- Programtidslinje ---- */
.pg-day{max-width:1060px;margin:0 auto 90px;scroll-margin-top:110px}
.pg-dayhead{display:flex;align-items:center;gap:22px;padding-bottom:20px;margin-bottom:34px;border-bottom:2px solid var(--border)}
.pg-daynum{font-size:clamp(3.5rem,11vw,5.5rem);font-weight:900;line-height:.8;letter-spacing:-4px;color:transparent;-webkit-text-stroke:2px var(--gold);text-stroke:2px var(--gold)}
.pg-dayname{display:block;font-size:clamp(1.5rem,5vw,2.4rem);font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--light);line-height:1}
.pg-daydate{display:block;font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:var(--gold);margin-top:6px}
.pg-item{display:grid;grid-template-columns:112px 28px 1fr;align-items:stretch}
.pg-time{font-size:1rem;font-weight:900;color:var(--gold);letter-spacing:-.3px;padding-top:11px;text-align:right;font-variant-numeric:tabular-nums}
.pg-node{position:relative}
.pg-node::before{content:"";position:absolute;left:50%;top:18px;bottom:-6px;width:2px;margin-left:-1px;background:var(--border)}
.pg-node::after{content:"";position:absolute;left:50%;top:15px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--dark);border:2px solid var(--gold)}
.pg-item:last-child .pg-node::before{display:none}
.pg-item.break .pg-time{color:#94a3b8;font-weight:800}
.pg-item.break .pg-node::after{background:var(--dark);border-color:#94a3b8;width:9px;height:9px;margin-left:-4.5px;top:16px}
.pg-item.break .pg-content h4{font-size:.92rem;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:2.5px}
.pg-item.break .pg-content p{font-size:.92rem;opacity:.6}
.pg-item.break .pg-content{padding-bottom:22px}
.pg-content{padding:6px 0 30px}
.pg-content h4{margin:0 0 6px;font-size:1.2rem;font-weight:900;color:var(--light);line-height:1.3}
.pg-content p{margin:0 0 10px;font-size:1rem;line-height:1.55;opacity:.85}
.pg-vid{margin:14px 0 12px;max-width:340px;border-radius:12px;overflow:hidden;border:1px solid var(--border);box-shadow:0 12px 28px rgba(0,0,0,.45);position:relative;aspect-ratio:16/9;background:#000}
.pg-vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.pg-vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pg-item.hero .pg-vid{max-width:380px}
@media (max-width:700px){.pg-vid{max-width:100%}}
.pg-venue{display:inline-block;font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);border:1px solid var(--border);border-radius:99px;padding:5px 13px;background:rgba(212,175,55,.07);text-decoration:none}
a.pg-venue{transition:background .25s,border-color .25s}
a.pg-venue:hover,a.pg-venue:focus-visible{background:rgba(212,175,55,.2);border-color:var(--gold)}
.pg-venue.tba{color:#94a3b8;border-color:rgba(148,163,184,.35);background:rgba(148,163,184,.08)}
.pg-item.hero .pg-node::after{width:15px;height:15px;margin-left:-7.5px;top:13px;background:var(--gold);box-shadow:0 0 0 5px rgba(212,175,55,.18)}
.pg-item.hero .pg-content{background:rgba(212,175,55,.07);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:0 14px 14px 0;padding:20px 24px;margin-bottom:30px}
.pg-item.hero .pg-content h4{font-size:1.45rem;color:var(--gold)}
.pg-flag{display:block;font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:3px;color:var(--gold);opacity:.8;margin-bottom:8px}
.pg-parallel{border:1px dashed var(--border);border-radius:14px;padding:18px 20px 6px;background:rgba(255,255,255,.03);margin-bottom:26px}
.pg-parallel > .pg-flag{margin-bottom:14px}
.pg-track{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.pg-track > div{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:11px;padding:15px 16px}
.pg-groups{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.pg-group{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.pg-group h5{margin:0;padding:10px 16px;background:rgba(212,175,55,.16);color:var(--gold);font-size:.85rem;font-weight:900;letter-spacing:2.5px;text-transform:uppercase}
.pg-group ol{list-style:none;margin:0;padding:14px 16px 16px}
.pg-group li{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid rgba(212,175,55,.14)}
.pg-group li:first-child{border-top:0;padding-top:0}
.pg-group li b{font-size:.92rem;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.pg-group li span{font-size:1rem;line-height:1.4}
.pg-group li span em{display:block;font-style:normal;font-size:.8rem;opacity:.65;margin-top:2px}
.pg-swap{font-size:.9rem;line-height:1.6;opacity:.8;margin-bottom:14px}

<header class="karusell" aria-roledescription="karusell" aria-label="Bilder fra Magiske Timer 2026">
<div class="karusell-spor" id="karusellSpor"></div>
<div class="karusell-tekst">
<div class="hero-location">Bergen 18.&ndash;20. sept 2026</div>

<div class="karusell-teller" id="karusellTeller" aria-live="off"></div>

<div style="margin-top:15px;font-size:0.7rem;opacity:0.7;">Web-design JIJ26</div>
</footer>
<script>
(function(){
  var BILDER = ["mt2026-01", "mt2026-02", "mt2026-03", "mt2026-04", "mt2026-05", "mt2026-06", "mt2026-07", "mt2026-08", "mt2026-09", "mt2026-10", "mt2026-11", "mt2026-12", "mt2026-13", "mt2026-14", "mt2026-15", "mt2026-16", "mt2026-17", "mt2026-18", "mt2026-19", "mt2026-20", "mt2026-21", "mt2026-22", "mt2026-23", "mt2026-24", "mt2026-25", "mt2026-26", "mt2026-27", "mt2026-28", "mt2026-29", "mt2026-30", "mt2026-31", "mt2026-32", "mt2026-33", "mt2026-34", "mt2026-35", "mt2026-36", "mt2026-37", "mt2026-38", "mt2026-39", "mt2026-40", "mt2026-41", "mt2026-42", "mt2026-43", "mt2026-44", "mt2026-45", "mt2026-46", "mt2026-47", "mt2026-48", "mt2026-50", "mt2026-51", "mt2026-52", "mt2026-53", "mt2026-54", "mt2026-55", "mt2026-56", "mt2026-57", "mt2026-58", "mt2026-59", "mt2026-60", "mt2026-61", "mt2026-62", "mt2026-63", "mt2026-64", "mt2026-65", "mt2026-66", "mt2026-67", "mt2026-68", "mt2026-69"];
  var spor = document.getElementById("karusellSpor");
  if (!spor) return;
  var teller = document.getElementById("karusellTeller");
  var slides = BILDER.map(function(n){
    var d = document.createElement("div"); d.className = "slide"; d.dataset.src = "galleri/web/" + n + ".webp";
    spor.appendChild(d); return d;
  });
  function last(i){
    var d = slides[i]; if (d.dataset.lastet) return; d.dataset.lastet = "1";
    var bak = new Image(); bak.className = "bak"; bak.alt = ""; bak.setAttribute("aria-hidden", "true"); bak.src = d.dataset.src;
    var fr = new Image(); fr.className = "for"; fr.alt = "Bilde " + (i+1) + " fra Magiske Timer 2026"; fr.src = d.dataset.src;
    d.appendChild(bak); d.appendChild(fr);
  }
  var n = 0, tid = null;
  function vis(i){
    n = (i + slides.length) % slides.length;
    last(n); last((n + 1) % slides.length);
    slides.forEach(function(s, k){ s.classList.toggle("aktiv", k === n); });
    if (teller) teller.textContent = (n + 1) + " / " + slides.length;
  }
  function start(){ stopp(); tid = setInterval(function(){ vis(n + 1); }, 3000); }
  function stopp(){ if (tid) { clearInterval(tid); tid = null; } }
  document.getElementById("karusellForrige").addEventListener("click", function(){ vis(n - 1); start(); });
  document.getElementById("karusellNeste").addEventListener("click", function(){ vis(n + 1); start(); });
  document.addEventListener("visibilitychange", function(){ document.hidden ? stopp() : start(); });
  vis(0); start();
})();
</script>
