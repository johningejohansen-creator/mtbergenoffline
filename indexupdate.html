<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magiske Timer 2026 | Oppdateres</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root {
    --gold: #d4af37;
    --dark: #0f172a;
    --light: #f8fafc;
}

body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    background-color: var(--dark);
    color: var(--light);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
}

.container {
    max-width: 600px;
    padding: 20px;
}

.logo {
    max-width: 180px;
    margin-bottom: 30px;
    filter: brightness(1.5);
}

h1 {
    font-size: 2rem;
    font-weight: 900;
    color: var(--gold);
}
</style>
</head>

<body>
<div class="container">
    <img src="mcn.svg" alt="MCN logo" class="logo">
    <h1>Siden er under oppdatering.<br>Kom tilbake litt senere.</h1>
</div>
</body>
</html>
